name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install headless display deps for Kivy
        run: sudo apt-get update && sudo apt-get install -y xvfb libmtdev1

      - name: Install package (pulls kivy)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests (under virtual framebuffer)
        env:
          KIVY_NO_ARGS: "1"
        run: xvfb-run -a python -m unittest discover -s tests -v
