[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kivyshell"
version = "0.0.1"
description = "Reusable Kivy UI primitives (uikit) and a daily-puzzle app shell (menu/calendar/activity), shared by yaque and yawop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kivy>=2.3"]
authors = [{ name = "Anatoli Verkhovski" }]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["kivyshell*"]
